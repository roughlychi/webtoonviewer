<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webtoonviewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="viewer"></div>
    <div id="drop-line"></div>
    <div id="filename-tip"></div>
    <input type="file" id="file-input" accept="image/*" multiple hidden />
    <template id="icon-warning">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 3L2 21h20L12 3z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <path d="M12 10v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="18" r="1.2" fill="currentColor" />
      </svg>
    </template>
    <template id="icon-broken">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect
          x="8"
          y="12"
          width="48"
          height="40"
          rx="4"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
        />
        <path
          d="M8 42l14-13 10 9 8-7 16 14"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <circle cx="22" cy="26" r="4" fill="currentColor" />
        <path
          class="crack"
          d="M34 12l-5 14 9 8-6 18"
          fill="none"
          stroke-width="4"
          stroke-linejoin="round"
        />
      </svg>
    </template>
    <template id="icon-plus">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    </template>
    <template id="icon-x">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </template>
    <template id="icon-up">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 4h14M12 20V9M7 13l5-5 5 5" />
      </svg>
    </template>
    <template id="icon-down">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 20h14M12 4v11M7 11l5 5 5-5" />
      </svg>
    </template>
    <template id="icon-grip">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01" stroke-width="3" />
      </svg>
    </template>
    <template id="icon-photo-plus">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M13 20H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6M3 16l5-5 4 4M16 19h6M19 16v6M15 9h.01"
        />
      </svg>
    </template>
    <template id="icon-sun">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"
        />
      </svg>
    </template>
    <template id="icon-moon">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </svg>
    </template>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
